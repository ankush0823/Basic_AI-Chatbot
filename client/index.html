<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correspondence — Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
 
<div class="sheet">
  <div class="letterhead">
    <div>
      <h1>Chatbot</h1>
    </div>
    <button class="new-thread" id="resetBtn" type="button" title="Start a new thread">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8a6 6 0 1 1 1.76 4.24"/>
        <path d="M2 12V8h4"/>
      </svg>
      New Chat
    </button>
  </div>
 
  <div class="thread" id="chat_container"></div>
 
  <form class="composer" id="promptForm">
    <textarea
      id="promptInput"
      name="prompt"
      rows="1"
      placeholder="Write your message…"
      autocomplete="off"
    ></textarea>
    <button class="send" type="submit">Send</button>
  </form>
</div>
 
<script type="module" src="/script.js"></script>
</body>
</html>
